apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfp
spec:
  # SQLite allows one writer: never run two pods against the same volume.
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mfp
          image: ghcr.io/brooksmtownsend/mfp:sha-CHANGEME
          envFrom:
            - configMapRef:
                name: mfp-config
            # Optional AI key, e.g. OPENROUTER_API_KEY. Manual tracking works without it.
            - secretRef:
                name: mfp-secrets
                optional: true
          ports:
            - name: http
              containerPort: 3000
          # The app rejects Host headers other than APP_URL/loopback, so probes
          # must send a loopback Host rather than the pod IP.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders: [{name: Host, value: "127.0.0.1:3000"}]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders: [{name: Host, value: "127.0.0.1:3000"}]
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mfp-data
        - name: tmp
          emptyDir: {}
