apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mfp
resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - ghcr-pull.sops.yaml
labels:
  - pairs:
      app.kubernetes.io/name: mfp
    includeSelectors: true
images:
  - name: ghcr.io/brooksmtownsend/mfp
    # Promote by changing newTag to sha-<commit> once the image workflow has run.
    newTag: sha-CHANGEME
