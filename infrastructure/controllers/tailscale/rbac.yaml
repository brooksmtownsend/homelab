# The operator's API server proxy (auth mode) impersonates the caller's
# Tailscale login. Kubernetes grants nothing by default, so bind it here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailscale-brooks-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: brooksmtownsend@gmail.com
