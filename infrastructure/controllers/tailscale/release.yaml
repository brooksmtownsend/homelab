apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: tailscale-operator
      version: "1.104.x"
      sourceRef:
        kind: HelmRepository
        name: tailscale
  # The chart reads OAuth creds from the `operator-oauth` Secret
  # (keys: client_id, client_secret); it's supplied via SOPS rather than values.
